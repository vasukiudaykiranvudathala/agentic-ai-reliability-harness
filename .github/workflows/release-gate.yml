name: release-gate

# Offline, deterministic release gate. No model API, no containers: the
# scripted adapter drives every scenario, so this runs on a clean CI worker.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

      - name: Run offline release gate
        run: |
          python -m arh.harness.release_gate \
            --scenarios scenarios \
            --datasets datasets \
            --profile profiles/strict-demo.yaml \
            --out reports/ci

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-scorecard-py${{ matrix.python-version }}
          path: reports/ci/
