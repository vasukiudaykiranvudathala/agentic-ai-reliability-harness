[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-reliability-harness"
version = "0.1.0"
description = "Reference reliability harness for agentic AI workflows"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6", "opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
otel = ["opentelemetry-exporter-otlp-proto-http>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
